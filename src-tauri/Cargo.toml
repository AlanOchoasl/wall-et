[package]
name = "wall-et-app"
version = "0.1.0"
description = "App personal de finanzas: servicios mensuales e inversiones en cauciones"
authors = ["Alan Ochoa"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "wall_et_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
uuid = { version = "1.29.3", features = ["v4"] }
chrono = "0.4.45"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
